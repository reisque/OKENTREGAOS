name: Scheduled OK Coleta sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled synchronization
        env:
          API_URL: https://okentregaos.onrender.com
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Sync-Secret: ${SYNC_SECRET}" \
            "${API_URL}/api/consultations/scheduled-sync"
